name: Build Android
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: true
      clean-build:
        type: boolean
        required: false
        default: false
      publish-mode:
        description: "gdrive | artifact | both"
        type: string
        required: false
        default: gdrive
    outputs:
      apk_link:
        description: arm64 Drive web content link
        value: ${{ jobs.build.outputs.apk_link }}
    secrets:
      FLUTTER_VERSION:
        required: false
      APK_SIGN:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      GOOGLE_FOLDER_ANDROID:
        required: false
      GOOGLE_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_link: ${{ steps.gdriveUpload_arm64.outputs.web-content-link }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter env
        uses: ./.github/actions/setup-flutter-env
        with:
          flutter-version: ${{ inputs.flutter-version }}
          flutter-version-secret: ${{ secrets.FLUTTER_VERSION }}

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          clean-build: ${{ inputs.clean-build }}
          keystore-base64: ${{ secrets.APK_SIGN }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}

      - name: Clean build (optional)
        if: ${{ inputs.clean-build || contains(github.event.head_commit.message || '', '[clean]') }}
        run: flutter clean

      - run: flutter pub get

      # cargokit passes --target-dir and ignores CARGO_TARGET_DIR. The app
      # redirects plugin builds to build/<plugin>, so the Rust output is
      # build/rhttp/build. Keep the toolchain in the same cache so a restored
      # target dir is compiled with the same rustc.
      - name: Hash rhttp Cargo.lock
        id: rhttp-cargo
        if: ${{ inputs.clean-build != true && !contains(github.event.head_commit.message || '', '[clean]') }}
        run: |
          lock=$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" -path '*/rhttp-*/rust/Cargo.lock' -print -quit)
          if [ -z "$lock" ]; then
            echo "hash=missing" >> "$GITHUB_OUTPUT"
            echo "rhttp Cargo.lock not found"
            exit 0
          fi
          echo "hash=$(sha256sum "$lock" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "Using $lock"

      - name: Cache rhttp cargo build
        if: ${{ inputs.clean-build != true && !contains(github.event.head_commit.message || '', '[clean]') && steps.rhttp-cargo.outputs.hash != 'missing' }}
        uses: actions/cache@v4
        with:
          path: |
            build/rhttp/build
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
          key: v1-${{ runner.os }}-rhttp-cargo-${{ steps.rhttp-cargo.outputs.hash }}

      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/Dartotsu_Android_arm64-v8a_${SAFE_REF}.apk"
          ls build/app/outputs/flutter-apk
        env:
          SAFE_REF: ${{ env.SAFE_REF }}

      - name: Upload Android artifacts
        if: ${{ inputs.publish-mode == 'artifact' || inputs.publish-mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/Dartotsu_Android_*.apk
          if-no-files-found: error

      - name: Upload arm64 File To Google Drive
        if: ${{ (inputs.publish-mode == 'gdrive' || inputs.publish-mode == 'both') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        id: gdriveUpload_arm64
        uses: hoatruongdev09/google-drive-file-upload-github-action@v1.1
        with:
          file-path: build/app/outputs/flutter-apk/Dartotsu_Android_arm64-v8a_${{ env.SAFE_REF }}.apk
          upload-name: Dartotsu_Android_arm64-v8a_${{ env.SAFE_REF }}.apk
          upload-to-folder-id: ${{ secrets.GOOGLE_FOLDER_ANDROID }}
          service-account-json: "${{ secrets.GOOGLE_KEY }}"
          overrwrite: true
